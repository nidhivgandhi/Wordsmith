spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wordsmith
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

wordsmith:
  jwt:
    # HS256 needs at least 256 bits of key. The default here is for local dev only —
    # anyone with the secret can mint valid tokens, so real deployments set JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  